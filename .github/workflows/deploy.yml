# Publica la web en GitHub Pages cada vez que se sube un cambio a la rama main,
# y además cada mañana, para que salgan solos los artículos programados para ese día.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC = 07:30 en España (horario de verano)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Datos legales: se configuran en Settings > Secrets and variables > Actions > Variables.
          PUBLIC_TITULAR_NIF: ${{ vars.TITULAR_NIF }}
          PUBLIC_TITULAR_DOMICILIO: ${{ vars.TITULAR_DOMICILIO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
